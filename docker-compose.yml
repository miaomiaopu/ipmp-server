services:
  # ═══ IPMP 后端 ═══
  server:
    image: ${CCR_REGISTRY:-ccr.ccs.tencentyun.com}/${CCR_NAMESPACE:-ipmp}/ipmp-server:dev
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
      - ccr.env
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/v1/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ═══ Nginx 反向代理 + 前端静态 ═══
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./www:/var/www/html:ro
    depends_on:
      - server
